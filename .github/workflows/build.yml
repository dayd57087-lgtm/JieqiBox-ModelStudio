name: Build Model Studio APK

# 产出签名 APK，挂到固定 tag "studio-latest" 上，链接永远不变：
#   https://github.com/<owner>/JieqiBox-ModelStudio/releases/download/studio-latest/jieqibox-model-studio.apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate unsigned APK
        id: find
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "unsigned=$APK"
          echo "unsigned=$APK" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sign"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sign/release.jks"
            echo "Using keystore from repository secret"
          else
            base64 -d app/release.jks.b64 > "$RUNNER_TEMP/sign/release.jks"
            echo "Using bundled self-signed keystore"
          fi

      - name: Align and sign APK
        id: sign
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BT"
          mkdir -p "$RUNNER_TEMP/sign"
          "$BT/zipalign" -f -p 4 "${{ steps.find.outputs.unsigned }}" "$RUNNER_TEMP/sign/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/sign/release.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias hotrank \
            --out "$RUNNER_TEMP/sign/jieqibox-model-studio.apk" \
            "$RUNNER_TEMP/sign/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/sign/jieqibox-model-studio.apk"
          ls -lh "$RUNNER_TEMP/sign/jieqibox-model-studio.apk"
          echo "apk=$RUNNER_TEMP/sign/jieqibox-model-studio.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jieqibox-model-studio-arm64
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish to the fixed release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="studio-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "${{ steps.sign.outputs.apk }}" \
            --title "模型工坊（最新构建）" \
            --notes "端侧采集 · 标注 · 训练。commit ${{ github.sha }}" \
            --prerelease
          echo "OK"
